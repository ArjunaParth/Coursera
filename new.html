<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Preview</title>
    <!-- Google Font for h1 styling -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fff;
            color: #212529;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
            margin: 0;
            text-align: left;
        }

        .container {
            margin-left: auto;
            margin-right: auto;
            max-width: 1140px;
            padding-left: 15px;
            padding-right: 15px;
        }

        .header {
            background-color: #477bff;
            color: #fff;
            margin-bottom: 2rem;
            padding: 2rem 1rem;
            text-align: center;
        }

        .section {
            padding: 0.5rem 2rem 1rem 2rem;
        }

        .section:hover {
            background-color: #f5f5f5;
            transition: color 2s ease-in-out, background-color 0.15s ease-in-out;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 48px;
            margin: 0;
        }

        button, input[type="submit"] {
            background-color: #d9edff;
            border: 1px solid transparent;
            border-radius: 0.25rem;
            font-size: 0.95rem;
            font-weight: 400;
            line-height: 1.5;
            padding: 0.375rem 0.75rem;
            text-align: center;
            transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out, border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            vertical-align: middle;
            cursor: pointer;
        }

        input[type="text"] {
            line-height: 1.8;
            width: 25%;
            padding: 0.2rem 0.5rem;
            border: 1px solid #ced4da;
            border-radius: 0.25rem;
        }

        input[type="text"]:hover {
            background-color: #f5f5f5;
            transition: color 2s ease-in-out, background-color 0.15s ease-in-out;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>Welcome to My Website</h1>
        <p>A clean, modern page styled with your custom CSS.</p>
    </header>

    <div class="container">
        <div class="section">
            <h2>Interactive Elements</h2>
            <p>Hover over this section to see the hover effect in action.</p>
            <form onsubmit="event.preventDefault();">
                <label for="username">Search / Input:</label><br><br>
                <input type="text" id="username" placeholder="Type here...">
                <input type="submit" value="Submit Form">
                <button type="button">Click Button</button>
            </form>
        </div>

        <div class="section">
            <h2>About Section</h2>
            <p>This layout uses the `.container` wrapper to center content while matching all configured heading, text, and button rules.</p>
        </div>
    </div>

</body>
</html>
